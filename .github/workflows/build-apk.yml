name: Build APK and publish to web assets

on:
  workflow_dispatch:
  push:
    branches:
      - claude/keyboard-app-ios-android-gfp7ql
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Copy APK into web assets
        run: |
          mkdir -p web/assets
          cp android/app/build/outputs/apk/debug/app-debug.apk web/assets/keyboard-ai.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/keyboard-ai.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "Publish debug APK to web assets"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-ai-apk
          path: web/assets/keyboard-ai.apk
